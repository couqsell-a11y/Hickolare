<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Construction — Hicko IT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080c10;
      --surface:  #0e1318;
      --border:   #1e2a35;
      --accent:   #f5a623;
      --accent2:  #0fa3e0;
      --text:     #e8edf2;
      --muted:    #5a6a78;
      --glow:     rgba(245,166,35,0.18);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    /* === GRID BACKGROUND === */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.4;
      z-index: 0;
    }

    /* === RADIAL GLOW === */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(245,166,35,0.12) 0%, transparent 70%);
      z-index: 0;
      animation: pulse 5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
      50%       { opacity: 1;   transform: translateX(-50%) scale(1.08); }
    }

    /* === LAYOUT === */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 0;
    }

    /* === LOGO BADGE === */
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeDown 0.6s ease forwards 0.2s;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg { width: 20px; height: 20px; fill: #080c10; }

    .logo-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }

    /* === STATUS PILL === */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeDown 0.6s ease forwards 0.4s;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* === HEADLINE === */
    h1 {
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 800;
      line-height: 0.95;
      text-align: center;
      letter-spacing: -0.03em;
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.55s;
    }

    h1 span {
      color: var(--accent);
      position: relative;
    }

    /* === SUBTITLE === */
    .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.7s;
    }

    /* === COUNTDOWN === */
    .countdown-wrap {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.85s;
    }

    .countdown-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .countdown-num {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
      text-align: center;
      transition: color 0.2s;
    }

    .countdown-num.flash { color: var(--accent); }

    .countdown-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .countdown-sep {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--border);
      margin-bottom: 1.2rem;
      animation: blink 1s step-end infinite;
    }

    /* === PROGRESS BAR === */
    .progress-track {
      width: min(380px, 90vw);
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      margin-bottom: 3rem;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.95s;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 99px;
      width: 0%;
      transition: width 1s linear;
    }

    /* === BUTTON === */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: #080c10;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 0 0 var(--glow);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 1.05s;
    }

    .cta-btn:hover {
      background: #ffc04a;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px var(--glow);
    }

    .cta-btn svg {
      width: 16px; height: 16px;
      transition: transform 0.2s;
    }

    .cta-btn:hover svg { transform: translateX(3px); }

    /* === BOTTOM STRIP === */
    .bottom-strip {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      gap: 1.5rem;
      z-index: 2;
    }

    .bottom-strip a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .bottom-strip a:hover { color: var(--accent); }

    /* === ANIMATIONS === */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* === SCANNING LINE === */
    .scan-line {
      position: fixed;
      top: -2px; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent2), transparent);
      animation: scan 4s ease-in-out infinite;
      z-index: 3;
      opacity: 0.5;
    }

    @keyframes scan {
      0%   { top: -2px; opacity: 0; }
      5%   { opacity: 0.5; }
      95%  { opacity: 0.5; }
      100% { top: 100vh; opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="scan-line"></div>

  <div class="page">

    <div class="logo-badge">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L20 8.5v7L12 19.82 4 15.5v-7L12 4.18z"/>
        </svg>
      </div>
      <span class="logo-name">Hicko IT</span>
    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      Active development
    </div>

    <h1>Under<br><span>Construction</span></h1>

    <p class="subtitle">
      We're building something great.<br>
      This page will be ready shortly —<br>redirecting you in the meantime.
    </p>

    <div class="countdown-wrap">
      <div class="countdown-block">
        <div class="countdown-num" id="cd-min">00</div>
        <div class="countdown-label">min</div>
      </div>
      <div class="countdown-sep">:</div>
      <div class="countdown-block">
        <div class="countdown-num" id="cd-sec">30</div>
        <div class="countdown-label">sec</div>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress"></div>
    </div>

    <a class="cta-btn" id="redirect-btn" href="https://couquelet.be">
      Take me there now
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>

  </div>

  <div class="bottom-strip">
    <span>© 2025 Hicko IT</span>
    <a href="mailto:info@hicko.be">info@hicko.be</a>
    <a href="https://couquelet.be">hicko.be</a>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    const REDIRECT_URL   = "https://couquelet.be";   // ← change this
    const COUNTDOWN_SECS = 30;                    // ← change this
    // ────────────────────────────────────────────────────────

    const minEl  = document.getElementById('cd-min');
    const secEl  = document.getElementById('cd-sec');
    const bar    = document.getElementById('progress');
    const btn    = document.getElementById('redirect-btn');

    btn.href = REDIRECT_URL;

    let remaining = COUNTDOWN_SECS;

    function pad(n) { return String(n).padStart(2, '0'); }

    function flash(el) {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 300);
    }

    function tick() {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;

      minEl.textContent = pad(mins);
      secEl.textContent = pad(secs);

      const pct = ((COUNTDOWN_SECS - remaining) / COUNTDOWN_SECS) * 100;
      bar.style.width = pct + '%';

      if (remaining <= 5) flash(secEl);

      if (remaining <= 0) {
        clearInterval(timer);
        window.location.href = REDIRECT_URL;
        return;
      }

      remaining--;
    }

    tick();
    const timer = setInterval(tick, 1000);
  </script>

</body>
</html>
